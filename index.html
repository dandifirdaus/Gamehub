<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gamehub - Dunia Game Kamu</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#f5f7ff;font-family:Arial,sans-serif}
header{padding:22px 7%;background:#121a30;border-bottom:1px solid #293451}
.logo{font-size:28px;font-weight:bold;color:#8b7cff}
header p{color:#aab4ce}
main{max-width:1150px;margin:auto;padding:28px 20px}
.hero{padding:30px;border-radius:18px;background:linear-gradient(120deg,#32246c,#152c55)}
.hero h1{font-size:36px;margin:0 0 12px}
.hero p{color:#d5d8f4}
input{width:100%;padding:15px;margin:22px 0;background:#151e34;color:white;border:1px solid #384667;border-radius:10px;font-size:16px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.filters button{padding:10px 16px;border:1px solid #394766;border-radius:20px;background:#17223b;color:white;cursor:pointer}
.filters button:hover,.filters button.active{background:#6554df}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.card{background:#141d32;border:1px solid #283653;border-radius:14px;overflow:hidden}
.card img{width:100%;height:145px;object-fit:cover;background:#26324b}
.info{padding:15px}
.tag{font-size:12px;color:#a99dff}
.info h3{margin:9px 0}
.info p{color:#b5bfd5;font-size:14px;min-height:34px}
.play{display:inline-block;padding:10px 15px;border-radius:8px;background:#6554df;color:white;text-decoration:none}
footer{text-align:center;color:#929db7;padding:30px}
</style>
</head>
<body>
<header><div class="logo">🎮 GAMEHUB</div><p>Temukan game favoritmu dalam satu tempat.</p></header>
<main>
<section class="hero"><h1>Dunia Game Kamu!</h1><p>Jelajahi game PC, Android, dan PlayStation.</p><p>Temukan game berikutnya yang akan kamu mainkan.</p></section>
<input id="search" placeholder="🔍 Cari nama game..." oninput="render()">
<div class="filters" id="filters"></div>
<div class="grid" id="games"></div>
</main>
<footer>© 2026 Gamehub · Main game, temukan petualangan baru.</footer>
<script>

const data=[
{n:"Genshin Impact",c:"Android",d:"Petualangan dunia fantasi Teyvat.",i:"https://www.vgdb.com.br/gf/fotos/games/media_39864/genshin-impact---39864.jpg",u:"https://genshin.hoyoverse.com/"},
{n:"Honkai: Star Rail",c:"PC",d:"Petualangan RPG melintasi galaksi.",i:"https://galaxylink.gg/public/images/s11730738955.webp",u:"https://hsr.hoyoverse.com/"},
{n:"Zenless Zone Zero",c:"PC",d:"Action RPG di kota futuristik.",i:"https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=600",u:"https://zenless.hoyoverse.com/"},
{n:"PUBG Mobile",c:"Android",d:"Bertahan hidup dalam battle royale.",i:"https://images.unsplash.com/photo-1542751371-adc38448a05e?w=600",u:"https://www.pubgmobile.com/"},
{n:"Warframe",c:"PC",d:"Pertempuran sci-fi berkecepatan tinggi.",i:"https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=600",u:"https://www.warframe.com/"},
{n:"God of War",c:"PlayStation",d:"Petualangan epik Kratos.",i:"https://cdn.mos.cms.futurecdn.net/v2/t%3A0%2Cl%3A420%2Ccw%3A1080%2Cch%3A1080%2Cq%3A80%2Cw%3A1080/73rHs7ci2yNFb3HVJb5Xd5.jpg",u:"https://www.playstation.com/en-id/games/god-of-war-ragnarok/"},
{n:"Fortnite",c:"PC",d:"Battle royale dan dunia kreatif.",i:"https://images.unsplash.com/photo-1542751371-adc38448a05e?w=600",u:"https://www.fortnite.com/"},
{n:"Minecraft",c:"PC",d:"Bangun dunia sesuai imajinasimu.",i:"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600",u:"https://www.minecraft.net/"}
];
let category="Semua";
function renderFilters(){document.getElementById("filters").innerHTML=["Semua","PC","Android","PlayStation"].map(c=>'<button class="'+(category===c?'active':'')+'" onclick="category='+JSON.stringify(c)+';render()">'+c+'</button>').join("")}
function render(){renderFilters();let q=document.getElementById("search").value.toLowerCase();let list=data.filter(g=>(category==="Semua"||g.c===category)&&(g.n.toLowerCase().includes(q)||g.d.toLowerCase().includes(q)));document.getElementById("games").innerHTML=list.map(g=>'<article class="card"><img src="'+g.i+'" alt="'+g.n+'" loading="lazy"><div class="info"><span class="tag">'+g.c+'</span><h3>'+g.n+'</h3><p>'+g.d+'</p><a class="play" href="'+g.u+'" target="_blank" rel="noopener">Kunjungi situs ↗</a></div></article>').join("")||"<p>Game tidak ditemukan.</p>"}
render();
</script>
</body>
</html>
